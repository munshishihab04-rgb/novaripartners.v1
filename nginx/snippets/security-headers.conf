add_header X-Content-Type-Options    "nosniff"                              always;
add_header X-Frame-Options           "DENY"                                 always;
add_header X-XSS-Protection          "0"                                    always;
add_header Referrer-Policy           "strict-origin-when-cross-origin"      always;
add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header Content-Security-Policy   "default-src 'self'; script-src 'self' https://widget.reviews.io; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://widget.reviews.io; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://*.reviews.io https://images.unsplash.com; connect-src 'self' https://api.reviews.io; frame-src 'self' https://xpay.nexigroup.com https://xpaysandbox.nexigroup.com; child-src 'self' https://xpay.nexigroup.com https://xpaysandbox.nexigroup.com; frame-ancestors 'none'; form-action 'self' https://xpay.nexigroup.com https://xpaysandbox.nexigroup.com; base-uri 'self'; object-src 'none'; upgrade-insecure-requests;" always;
