kind = "web"
previewPath = "/digi-shop/"
title = "Software License Store"
version = "1.0.0"
id = "artifacts/digi-shop"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/digi-shop/" ]
localPort = 25513

[services.development]
run = "pnpm --filter @workspace/digi-shop run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/digi-shop", "run", "build" ]
publicDir = "artifacts/digi-shop/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25513"
BASE_PATH = "/digi-shop/"
