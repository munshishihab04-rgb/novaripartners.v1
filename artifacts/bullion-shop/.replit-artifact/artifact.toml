kind = "web"
previewPath = "/bullion-shop/"
title = "US Bullion Coin Store"
version = "1.0.0"
id = "artifacts/bullion-shop"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/bullion-shop/" ]
localPort = 21349

[services.development]
run = "pnpm --filter @workspace/bullion-shop run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/bullion-shop", "run", "build" ]
publicDir = "artifacts/bullion-shop/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21349"
BASE_PATH = "/bullion-shop/"
